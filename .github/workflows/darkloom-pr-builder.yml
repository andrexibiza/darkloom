name: Build Darkloom alignment PR

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: darkloom-alignment-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  migrate-test-publish:
    if: github.head_ref == 'agent/rebase-hermes-main-2026-08-19'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Materialize deterministic migration
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.darkloom-migration.part*.b64 \
            | base64 -d \
            | gzip -dc \
            > scripts/apply_rebase_migration.py
          python -m py_compile scripts/apply_rebase_migration.py
      - name: Apply deterministic migration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_rebase_migration.py
          rm -f scripts/.darkloom-migration.part*.b64
      - name: Install Darkloom
        run: python -m pip install -e ".[dev,mcp]"
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Unit and packaging tests
        run: python -m pytest -q
      - name: Verify exact Hermes source contract
        shell: bash
        run: |
          set -euo pipefail
          HERMES_SHA="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('src/darkloom/compatibility-manifest.json').read_text())
          print(manifest['upstream']['verified_commit'])
          PY
          )"
          HERMES_ROOT="$RUNNER_TEMP/hermes-agent"
          git init "$HERMES_ROOT"
          git -C "$HERMES_ROOT" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$HERMES_ROOT" fetch --depth=1 origin "$HERMES_SHA"
          git -C "$HERMES_ROOT" checkout --detach FETCH_HEAD
          python scripts/check_upstream_alignment.py "$HERMES_ROOT"
      - name: Publish tested source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "darkloom-alignment[bot]"
          git config user.email "darkloom-alignment[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: align Darkloom with current Hermes main"
          git push origin "HEAD:${{ github.head_ref }}"
