[project]
name = "darkloom"
version = "0.1.0"
description = "Bounded privacy transport and semantic Hermes compatibility controls"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
mcp = ["mcp>=1.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
darkloom = ["compatibility-manifest.json", "keys/*.asc"]

[project.scripts]
darkloom-mcp = "darkloom.mcp_server:serve"
