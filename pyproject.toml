[project]
name = "hermes-tor"
version = "0.1.0"
description = "Micro-TOR client for Hermes agents — bridge-backed anonymous routing via SOCKS5"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
mcp = ["mcp>=1.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
hermes-tor-mcp = "hermes_tor.mcp_server:serve"
